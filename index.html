<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3c300">
    <link rel="manifest" href="manifest.json">
    <title>Gunz and Loaded | Garena Ops</title>

    <!-- Core styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/carousel.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/items.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Intro / auth overlay -->
    <div id="intro-overlay">
        <div class="intro-center">
            <img src="logo.png" alt="Gunz and Loaded" class="intro-logo">


            <section class="auth-panel" aria-label="Authentication">
                <div class="auth-mode-switch" role="tablist" aria-label="Authentication modes">
                    <button id="login-tab" class="auth-tab active" type="button" data-auth-view="login" role="tab" aria-selected="true">Log In</button>
                    <button id="signup-tab" class="auth-tab" type="button" data-auth-view="signup" role="tab" aria-selected="false">Register</button>
                </div>

                <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
                <p id="auth-error" class="auth-error" role="alert" aria-live="assertive"></p>

                <form id="login-form" class="auth-form active" data-auth-form="login">
                    <label class="auth-field">
                        <span>Email</span>
                        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </label>
                    <label class="auth-field">
                        <span>Password</span>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                    </label>
                    <button id="login-submit" class="enter-btn auth-submit" type="submit">
                        <span class="btn-icon">&#8982;</span> Log In <span class="muzzle-flash"></span>
                    </button>
                    <button class="auth-text-link" type="button" data-auth-view="forgot">Forgot Password?</button>
                </form>

                <form id="signup-form" class="auth-form" data-auth-form="signup">
                    <label class="auth-field">
                        <span>Email</span>
                        <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </label>
                    <label class="auth-field">
                        <span>Password</span>
                        <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="6" required>
                    </label>
                    <button id="signup-submit" class="enter-btn auth-submit" type="submit">
                        <span class="btn-icon">&#8982;</span> Register <span class="muzzle-flash"></span>
                    </button>
                </form>

                <form id="forgot-form" class="auth-form" data-auth-form="forgot">
                    <label class="auth-field">
                        <span>Email</span>
                        <input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="Enter your account email" required>
                    </label>
                    <button id="forgot-submit" class="enter-btn auth-submit" type="submit">
                        <span class="btn-icon">&#8982;</span> Send Reset Link <span class="muzzle-flash"></span>
                    </button>
                    <button class="auth-text-link" type="button" data-auth-view="login">Back to Log In</button>
                </form>

                <form id="reset-form" class="auth-form" data-auth-form="reset">
                    <label class="auth-field">
                        <span>New Password</span>
                        <input id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="Create a new password" minlength="6" required>
                    </label>
                    <button id="reset-submit" class="enter-btn auth-submit" type="submit">
                        <span class="btn-icon">&#8982;</span> Update Password <span class="muzzle-flash"></span>
                    </button>
                </form>
            </section>
        </div>
    </div>

    <!-- Main app shell -->
    <div class="main-container">
        <header class="header">
            <div class="logo-container">
                <img src="logo.png" alt="Gunz and Loaded" class="main-logo">
                <span class="logo-tagline">GUNZ &amp; LOADED</span>
            </div>

            <nav class="top-nav" aria-label="Primary">
                <button onclick="showContent('home', event)" class="nav-btn active">HOME</button>
                <button onclick="showContent('guns', event)" class="nav-btn">WEAPON</button>
                <button onclick="showContent('mode', event)" class="nav-btn">MODE</button>
                <button onclick="showContent('draw', event)" class="nav-btn">DRAW</button>
                <button onclick="showContent('download', event)" class="nav-btn">DOWNLOAD</button>
                <button onclick="showContent('contact', event)" class="nav-btn">CONTACT</button>
                <button onclick="showContent('topup', event)" class="nav-btn">TOP UP</button>
            </nav>

            <div class="auth-session">
                <span id="session-email" class="session-email">Guest</span>
                <button id="logout-btn" class="nav-btn logout-btn" type="button" hidden>LOG OUT</button>
            </div>
        </header>

        <div class="content-wrapper">
            <main id="content-root" class="display-box">
                <!-- Sections are rendered from js/data/site-content.js -->
            </main>
        </div>
    </div>

    <script type="module" src="js/script.js"></script>
</body>
</html>
